services:
  - type: web
    name: certflow-api
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build -w backend
    startCommand: npm start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SAME_SITE
        value: lax
